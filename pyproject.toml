[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "puffo-coach"
version = "0.1.0"
description = "Puffo Coach: Build LLM-friendly Markdown context from personal data."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0",
    "requests>=2.31",
    "textual>=8.2.8",
]

[project.scripts]
puffo-coach = "puffo_coach.cli:main"
puffo-coach-tui = "puffo_coach.tui:main"

